plugins { id 'com.android.application' }
android {
  namespace 'com.brainengineering.app'
  compileSdk 36
  defaultConfig {
    applicationId 'com.brainengineering.app'
    minSdk 23
    targetSdk 36
    versionCode 5
    versionName '1.3.1'
