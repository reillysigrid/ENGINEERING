name: BrainEngineering emulator smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android 10 emulator and test startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.brainengineering.app/.MainActivity
            sleep 8
            adb exec-out screencap -p > brain-home.png
            adb shell dumpsys activity activities | grep -F 'com.brainengineering.app'
            adb logcat -d -s AndroidRuntime:E > crash.log
            if grep -q 'FATAL EXCEPTION' crash.log; then cat crash.log; exit 1; fi
            echo 'Android launch smoke test passed.'
      - name: Screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainEngineering-emulator-smoke
          path: |
            brain-home.png
            crash.log
          if-no-files-found: ignore
