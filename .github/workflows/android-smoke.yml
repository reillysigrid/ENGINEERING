name: BrainEngineering emulator smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            image: default
          - api: 35
            image: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app and verify native screens on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.brainengineering.app/.MainActivity
            sleep 14
            adb exec-out screencap -p > brain-home.png
            adb shell input tap 540 2115
            sleep 2
            adb exec-out screencap -p > brain-plan.png
            if cmp -s brain-home.png brain-plan.png; then echo 'Planner tab did not change screen'; exit 1; fi
            adb shell input tap 900 2115
            sleep 2
            adb exec-out screencap -p > brain-quiz.png
            if cmp -s brain-plan.png brain-quiz.png; then echo 'Quiz tab did not change screen'; exit 1; fi
            adb shell dumpsys activity activities | grep -F 'com.brainengineering.app'
            adb logcat -d -s AndroidRuntime:E > crash.log
            if grep -q 'FATAL EXCEPTION' crash.log; then cat crash.log; exit 1; fi
            echo 'Home, Planner and Quiz smoke screens captured; no AndroidRuntime fatal crash.'
      - name: Screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainEngineering-emulator-api${{ matrix.api }}
          path: |
            brain-home.png
            brain-plan.png
            brain-quiz.png
            crash.log
          if-no-files-found: ignore
