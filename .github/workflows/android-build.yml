name: BrainEngineering Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Android APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BrainEngineering-APK-para-Android
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrainEngineering-AAB-SIN-FIRMAR
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Package unsigned release APK (sign privately, never in CI)
        uses: actions/upload-artifact@v4
        with:
          name: BrainEngineering-APK-RELEASE-SIN-FIRMAR
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Export build-tools signing helper for local verification
        uses: actions/upload-artifact@v4
        with:
          name: Android-sdk36-apksigner-helper
          path: /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
